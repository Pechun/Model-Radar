name: 模型雷達 HLJ 更新

on:
  schedule:
    - cron: "37 21 * * *"   # 台灣 05:37
    - cron: "37 9 * * *"    # 台灣 17:37
  workflow_dispatch:
    inputs:
      rescore:
        description: "全部重算外型分數（改過 taste.json 後勾選）"
        type: boolean
        default: false
  push:
    paths: ["scraper/taste.json"]

jobs:
  hlj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt

      - name: 快取 CLIP 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-b32

      - name: 安裝套件
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scraper/requirements.txt -r scraper/requirements-clip.txt

      - name: 解析器自我測試
        run: python tests/test_hlj.py

      - name: 抓 HLJ、算外型分數、寫入 Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESCORE: ${{ (github.event_name == 'push' || inputs.rescore) && '1' || '0' }}
        run: python scraper/scrape_hlj.py
