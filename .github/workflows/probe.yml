name: 資料來源連線測試
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt numpy
      - name: HLJ dry run
        run: |
          DRY_RUN=1 NO_CLIP=1 MAX_PAGES=1 MAX_DETAIL=3 timeout 900 python scraper/scrape_hlj.py > out.txt 2>&1 || true
          grep -E "^\[|error" out.txt | head -40 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=log::/'
          echo
          sed -n '/^\[$/,$p' out.txt | head -c 2500 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=json::/'
          echo
          curl -s -A "Mozilla/5.0 Chrome/129" "https://www.hlj.com/search/?GenreCode2=Science-Fiction&MacroType2=Injection+Kits&StockLevel=All+Future+Release&Page=2" -o p2.html
          echo "::notice title=page2::$(grep -o 'productthumbs/[a-z0-9-]*/[a-z0-9-]*_0' p2.html | head -5 | tr '\n' ' ') size=$(wc -c < p2.html)"
