name: 資料來源連線測試
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt numpy
      - name: HLJ detail debug
        run: |
          python - <<'PY'
          import sys, re, json
          sys.path.insert(0, "scraper")
          import scrape_hlj as s
          html = s.fetch("https://www.hlj.com/plamatea-pre-war-military-t-60-power-armor-fallout-gsc59075")
          open("d.html","w").write(html)
          d = s.parse_detail(html)
          print("::notice title=parsed::" + json.dumps(d, ensure_ascii=False))
          from bs4 import BeautifulSoup
          t = BeautifulSoup(html, "html.parser").get_text("\n", strip=True)
          for lb in ["Item Type", "Release Date", "Manufacturer", "USD", "Cancellation"]:
              for m in list(re.finditer(re.escape(lb), t))[:3]:
                  frag = t[max(0, m.start()-60): m.end()+80].replace("\n", " | ")
                  print(f"::notice title={lb}::" + frag)
          PY
