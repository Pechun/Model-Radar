name: 資料來源連線測試
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt numpy
      - name: HLJ dry run
        run: |
          DRY_RUN=1 NO_CLIP=1 MAX_PAGES=1 MAX_DETAIL=4 timeout 900 python scraper/scrape_hlj.py > out.txt 2>&1 || echo "exit $?" >> out.txt
          tail -30 out.txt | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=tail::/'
          echo
          grep -E "^\[(detail|error)" out.txt | head -20 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::notice title=detail::/'
