name: 資料來源連線測試
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          for u in \
            "https://hobby.watch.impress.co.jp/docs/news/" \
            "https://bandai-hobby.net/schedule/" \
            "https://bandai-hobby.net/item/" \
            "https://p-bandai.jp/hobby/" \
            "https://www.kotobukiya.co.jp/product/" \
            "https://www.goodsmile.com/ja/products" \
            "https://www.hlj.com/" \
            "https://www.amiami.com/eng/" \
            "https://api.amiami.com/api/v1.0/items?pagemax=5&lang=eng" \
            "https://www.nin-nin-game.com/en/" \
            "https://plazajapan.com/products.json?limit=5" \
            "https://www.gundamplanet.com/products.json?limit=5" \
            "https://www.newtype.us/products.json?limit=5" \
            "https://www.usagundamstore.com/products.json?limit=5" \
            "https://www.hobbylinkjapan.com/" \
            "https://www.1999.co.jp/eng/" ; do
            r=$(curl -s -o /tmp/b -w "%{http_code} %{size_download}" -A "$UA" -L --max-time 25 "$u" || echo "ERR 0")
            cf=$(grep -c "Just a moment" /tmp/b 2>/dev/null || true)
            echo "::notice title=probe::$r cf=$cf $u"
          done
