name: 資料來源連線測試
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt numpy
      - name: HLJ result counts
        run: |
          python - <<'PY'
          import sys, re, time
          sys.path.insert(0, "scraper")
          import scrape_hlj as s
          from bs4 import BeautifulSoup
          out = []
          for g in s.GENRES:
              for kt in s.KIT_TYPES:
                  for mode in s.MODES:
                      html = s.fetch(s.search_url(g, kt, mode, 1)); time.sleep(1)
                      t = BeautifulSoup(html, "html.parser").get_text(" ", strip=True)
                      m = re.search(r"Showing\s+([\d,]+)\s+results?", t)
                      nr = "NO RESULT" if re.search(r"no (results|items|products)|0 results|did not match", t, re.I) else ""
                      out.append(f"{g}/{kt}/{mode}: {m.group(1) if m else '?'} {nr}")
          for i in range(0, len(out), 14):
              print("::notice title=c%d::" % i + "%0A".join(out[i:i+14]))
          PY
