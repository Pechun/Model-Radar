<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="模型雷達">
<title>模型雷達</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #16181b; --panel: #1f2226; --line: #2e3238; --text: #e8e6e1; --dim: #9a9ea5;
    --accent: #e8a33d; --danger: #e5534b; --ok: #57ab5a; --chip: #2a2e34;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body { padding-bottom: env(safe-area-inset-bottom); }

  header { position: sticky; top: 0; z-index: 10; background: rgba(22,24,27,.94);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .top { display: flex; align-items: baseline; gap: 10px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .08em; font-weight: 800; }
  h1 span { color: var(--accent); }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; text-align: right; cursor: pointer; }
  #status.bad { color: var(--danger); font-weight: 700; }
  #statusDetail { display: none; font-size: 12px; color: var(--dim); margin-top: 6px; white-space: pre-wrap; }
  #statusDetail.open { display: block; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tabs { display: flex; background: var(--panel); border-radius: 8px; padding: 2px; }
  .tabs button { background: none; border: 0; color: var(--dim); padding: 6px 12px; border-radius: 6px;
    font-size: 14px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #1a1a1a; font-weight: 700; }
  input[type=search], select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 16px; }
  input[type=search] { flex: 1 1 180px; min-width: 0; }
  label.chk { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 4px; }

  main { padding: 14px 16px 40px; }
  #count { font-size: 12px; color: var(--dim); margin: 0 0 10px; }
  /* 大圖（預設）：手機一欄、電腦每張約 340px；小圖：手機兩欄 */
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; } }
  body.small .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  @media (min-width: 700px) { body.small .grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; } }
  body:not(.small) .name { font-size: 15px; }
  body:not(.small) .meta, body:not(.small) .rel { font-size: 12.5px; }
  body:not(.small) .score { font-size: 15px; padding: 3px 9px; }
  .sizeBtn { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 14px; cursor: pointer; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: border-color .15s; }
  .card:hover { border-color: var(--accent); }
  
  .img { position: relative; aspect-ratio: 1 / 1; background: #fff; }
  .img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .badges { position: absolute; top: 6px; left: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .b { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #000c; color: #fff; }
  .b.re { background: #3b6ea8; } .b.out { background: #555; } .b.soon { background: var(--danger); }
  .b.dl { background: #000c; }
  .score { position: absolute; top: 6px; right: 6px; font-size: 13px; font-weight: 800; padding: 2px 7px;
    border-radius: 6px; background: #000d; color: var(--dim); }
  .score.hi { color: var(--accent); } .score.mid { color: #f0c27a; }
  .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .name { font-size: 13px; line-height: 1.35; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: 11px; color: var(--dim); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; padding-top: 4px; }
  .price { font-weight: 800; color: var(--accent); font-size: 15px; }
  .price s { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 4px; }
  .rel { font-size: 11px; color: var(--dim); }
  .b.soon, .b.dl { letter-spacing: .02em; }

  .card.liked { border-color: var(--accent); }
  .card.disliked { opacity: .4; }
  .card a { color: inherit; text-decoration: none; }
  .card a.img { display: block; }
  .acts { display: flex; border-top: 1px solid var(--line); }
  .acts button { flex: 1; background: none; border: 0; padding: 8px 0; font-size: 13px; color: var(--text); cursor: pointer; opacity: .45; }
  .acts button:hover { opacity: 1; background: var(--chip); }
  .acts button.on { opacity: 1; }
  .acts button.up.on { background: rgba(232,163,61,.18); color: var(--accent); font-weight: 700; }
  .acts button.down.on { background: rgba(229,83,75,.18); }
  #learn { font-size: 12px; color: var(--dim); margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #learn .bar { flex: 0 1 140px; height: 5px; background: var(--chip); border-radius: 9px; overflow: hidden; }
  #learn .bar i { display: block; height: 100%; background: var(--accent); }
  #learn button { background: var(--accent); color: #1a1a1a; border: 0; border-radius: 6px; padding: 3px 9px;
    font-size: 12px; font-weight: 700; cursor: pointer; }
  .empty { text-align: center; color: var(--dim); padding: 60px 16px; line-height: 1.8; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  #sentinel { height: 1px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>模型<span>雷達</span></h1>
    <div id="status">載入中…</div>
  </div>
  <div id="statusDetail"></div>
  <div class="controls">
    <div class="tabs" id="tabs">
      <button data-tab="all" class="on">全部</button>
      <button data-tab="reserve">預約中</button>
      <button data-tab="new">新品</button>
      <button data-tab="liked">收藏</button>
    </div>
    <input type="search" id="q" placeholder="搜尋名稱、廠商、作品…" autocomplete="off">
    <select id="sort">
      <option value="style">外型契合度高→低</option>
      <option value="deadline">決定期限近→遠</option>
      <option value="release">發售日近→遠</option>
      <option value="newest">最新上架</option>
      <option value="price_asc">價格低→高</option>
      <option value="price_desc">價格高→低</option>
    </select>
    <select id="minScore">
      <option value="0" selected>全部</option>
      <option value="50">契合 ≥ 50</option>
      <option value="70">契合 ≥ 70</option>
      <option value="85">契合 ≥ 85</option>
    </select>
    <button class="sizeBtn" id="sizeBtn" type="button">小圖</button>
    <label class="chk"><input type="checkbox" id="hideOut">隱藏售完</label>
  </div>
  <div id="learn"></div>
</header>

<main>
  <p id="count"></p>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
</main>

<script>
// ===== 設定：填入你的 Supabase 專案資訊（anon key 可公開，資料表已設為唯讀） =====
const SUPABASE_URL = "https://yidnwqdzuduvfvmiwpdp.supabase.co";        // 例：https://xxxx.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZG53cWR6dWR1dmZ2bWl3cGRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzM4MjcsImV4cCI6MjEwNjM0OTgyN30.Xa1_T7OIpGriYQmV9mKOt9yQKMgKGZ4Y3hQAPEofb-A";   // Project Settings → API → anon public
// ================================================================================

const PAGE = 48;
const CAT_LABEL = { gundam: "ガンプラ他", mecha: "ロボット・特撮", figure: "フィギュア", news: "模型新聞", hobbywatch: "Hobby Watch",
  "Gundam": "鋼彈", "Science-Fiction": "科幻", "Figures": "角色" };
const state = { all: [], view: [], shown: 0, tab: "all", q: "", sort: "style", hideOut: false, minScore: 0,
                fb: {}, showDis: false, dirty: false, remote: false };
const LS_KEY = "kitradar_feedback_v1";
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = (n) => (n == null ? "" : "¥" + n.toLocaleString("ja-JP"));
const usd = (n) => (n == null ? "" : "US$" + Number(n).toFixed(2));
const priceKey = (k) => (k.source !== "hlj" ? k.price_jpy : null) ?? (k.price_usd != null ? k.price_usd * 150 : null);
// ---- 收藏（保留 CLIP 相似度程式，目前權重 w = 0，不影響排序） ----
function decodeEmb(b64) {
  const bin = atob(b64), v = new Float32Array(bin.length);
  let n = 0;
  for (let i = 0; i < bin.length; i++) { let x = bin.charCodeAt(i); if (x > 127) x -= 256; v[i] = x; n += x * x; }
  n = Math.sqrt(n) || 1;
  for (let i = 0; i < v.length; i++) v[i] /= n;
  return v;
}
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
function topMean(v, set, k = 3) {
  if (!set.length) return null;
  const s = set.map((x) => dot(v, x)).sort((a, b) => b - a).slice(0, k);
  return s.reduce((a, b) => a + b, 0) / s.length;
}
// 原始分數 = 文字偏好分數 + 回饋相似度（回饋越多權重越高），再換成 0–100 百分位
function computeScores(kits) {
  const likes = [], dis = [];
  for (const f of Object.values(state.fb)) {
    if (!f.emb) continue;
    f._v ||= decodeEmb(f.emb);
    if (f.vote > 0) likes.push(f._v);
  }
  const n = likes.length + dis.length;
  const w = 0, BASE = 0.72;   // 收藏不影響排序（只依外型描述打分，不會越篩越窄）
  for (const k of kits) {
    if (k.style_score == null) { k.raw = null; continue; }
    let fb = 0;
    if (k.style_emb) {
      k._v ||= decodeEmb(k.style_emb);
      const l = topMean(k._v, likes), d = topMean(k._v, dis);
      if (l !== null) fb += (l - BASE) * 100;
      if (d !== null) fb -= (d - BASE) * 100;
    }
    k.raw = k.style_score + w * fb;
  }
  const s = kits.filter((k) => k.raw != null).sort((a, b) => a.raw - b.raw);
  const N = s.length;
  s.forEach((k, i) => { k.pct = N > 1 ? Math.round((i / (N - 1)) * 100) : 50; });
  kits.forEach((k) => { if (k.raw == null) k.pct = null; });
  renderLearn(Object.values(state.fb).filter((f) => f.vote > 0).length);
}
function renderLearn(lk) {
  $("learn").innerHTML = lk ? `<span>★ 已收藏 ${lk} 款${state.remote ? "" : "（只存在這台裝置）"}</span>` : "";
}

// ---- 回饋儲存：Supabase（跨裝置）＋ localStorage（備援） ----
function saveLocal() {
  const o = {};
  for (const [k, v] of Object.entries(state.fb)) { const { _v, ...r } = v; o[k] = r; }
  try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch {}
}
function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } }
const sbH = () => ({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, "Content-Type": "application/json" });
async function saveRemote(id, row) {
  if (!state.remote) return;
  try {
    if (!row) await fetch(`${SUPABASE_URL}/rest/v1/kit_feedback?kit_id=eq.${encodeURIComponent(id)}`, { method: "DELETE", headers: sbH() });
    else {
      const { _v, ...clean } = row;
      await fetch(`${SUPABASE_URL}/rest/v1/kit_feedback`, { method: "POST",
        headers: { ...sbH(), Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ ...clean, updated_at: new Date().toISOString() }) });
    }
  } catch {}
}
function vote(id, v) {
  const k = state.all.find((x) => x.id === id);
  const cur = state.fb[id]?.vote;
  if (cur === v) { delete state.fb[id]; saveRemote(id, null); }
  else {
    state.fb[id] = { kit_id: id, vote: v, name: k?.name, image_url: k?.image_url, product_url: k?.product_url, emb: k?.style_emb || null };
    saveRemote(id, state.fb[id]);
  }
  saveLocal();
  computeScores(state.all);
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (el) el.outerHTML = card(k);
}
const daysUntil = (iso) => {
  if (!iso) return null;
  const t = new Date(iso + "T00:00:00+09:00").getTime();
  return Math.ceil((t - Date.now()) / 86400000);
};

async function api(path) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                 Range: `${from}-${from + 999}` },
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const rows = await r.json();
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}

function renderStatus(run) {
  const el = $("status"), det = $("statusDetail");
  if (!run) { el.textContent = "尚無更新紀錄"; el.classList.add("bad"); return; }
  const t = new Date(run.finished_at || run.started_at);
  const hours = (Date.now() - t.getTime()) / 3600000;
  const when = t.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const bad = !run.ok || !run.finished_at || hours > 36;
  el.textContent = `${bad ? "⚠ " : ""}更新 ${when}`;
  el.classList.toggle("bad", bad);
  const cats = run.per_category || {};
  const lines = Object.entries(cats).map(([k, v]) => {
    const [c, l] = k.split(":");
    return `${v === 0 ? "⚠ " : ""}${CAT_LABEL[c] || c}・${l === "reserve" ? "預約" : "新品"}：${v}`;
  });
  lines.push(`本次新增 ${run.items_new}、更新 ${run.items_updated}、錯誤 ${run.errors}`);
  if (hours > 36) lines.push("超過 36 小時沒有成功更新，請看 GitHub Actions。");
  if (run.message) lines.push("—\n" + run.message);
  det.textContent = lines.join("\n");
}

function applyFilters() {
  state.dirty = false;
  computeScores(state.all);
  const q = state.q.trim().toLowerCase();
  let v = state.all.filter((k) => {
    const f = state.fb[k.id]?.vote;
    if (state.tab === "liked") { if (f !== 1) return false; }
    else {
      if (state.tab !== "all" && k.listing !== state.tab) return false;
    }
    if (state.hideOut && k.sold_out) return false;
    if (state.tab !== "liked" && state.minScore > 0 && k.pct != null && k.pct < state.minScore) return false;
    if (q) {
      const hay = [k.name, k.maker, k.series, k.original_work, k.jan].join(" ").toLowerCase();
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  });
  const far = "9999-12-31";
  const cmp = {
    deadline: (a, b) => (a.cancel_deadline || far).localeCompare(b.cancel_deadline || far)
                       || (a.release_date || far).localeCompare(b.release_date || far),
    release: (a, b) => (a.release_date || far).localeCompare(b.release_date || far),
    newest: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || ""),
    style: (a, b) => (b.pct ?? -1) - (a.pct ?? -1),
    price_asc: (a, b) => (priceKey(a) ?? 1e9) - (priceKey(b) ?? 1e9),
    price_desc: (a, b) => (priceKey(b) ?? -1) - (priceKey(a) ?? -1),
  }[state.sort];
  // 決定期限已過的排到後面
  if (state.sort === "deadline") {
    v.sort((a, b) => {
      const pa = daysUntil(a.cancel_deadline), pb = daysUntil(b.cancel_deadline);
      const ea = pa != null && pa < 0, eb = pb != null && pb < 0;
      return ea - eb || cmp(a, b);
    });
  } else v.sort(cmp);
  state.view = v;
  state.shown = 0;
  $("grid").innerHTML = "";
  $("count").textContent = `${v.length} 款`;
  renderMore();
}

function card(k) {
  const d = daysUntil(k.cancel_deadline);
  const badges = [];
  if (k.is_rerelease) badges.push('<span class="b re">再販</span>');
  if (k.sold_out) badges.push('<span class="b out">售完</span>');
  if (d != null && d >= 0) badges.push(`<span class="b ${d <= 7 ? "soon" : "dl"}">${d === 0 ? "今天截止" : "剩 " + d + " 天"}</span>`);
  const meta = [k.maker, k.series || k.original_work].filter(Boolean).join("・");
  const sc = k.pct == null ? "" : `<span class="score ${k.pct >= 85 ? "hi" : k.pct >= 60 ? "mid" : ""}">${k.pct}</span>`;
  const strike = k.list_price_jpy && k.price_jpy && k.list_price_jpy > k.price_jpy ? `<s>${yen(k.list_price_jpy)}</s>` : "";
  const f = state.fb[k.id]?.vote;
  const url = esc(k.product_url);
  return `<div class="card ${f > 0 ? "liked" : f < 0 ? "disliked" : ""}" data-id="${esc(k.id)}">
    <a class="img" href="${url}" target="_blank" rel="noopener">${k.image_url ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(k.image_url)}" alt="">` : ""}
      <div class="badges">${badges.join("")}</div>${sc}</a>
    <div class="body">
      <a class="name" href="${url}" target="_blank" rel="noopener">${esc(k.name)}</a>
      <div class="meta">${esc(meta || CAT_LABEL[k.category] || "")}</div>
      <div class="rel">發售 ${esc(k.release_text || "TBA")}</div>
      <div class="row"><span class="price">${k.source !== "hlj" && k.price_jpy ? yen(k.price_jpy) + strike : usd(k.price_usd)}</span></div>
    </div>
    <div class="acts">
      <button class="up ${f > 0 ? "on" : ""}" data-v="1" aria-label="收藏">${f > 0 ? "★ 已收藏" : "☆ 收藏"}</button>
    </div></div>`;
}

function renderMore() {
  const next = state.view.slice(state.shown, state.shown + PAGE);
  $("grid").insertAdjacentHTML("beforeend", next.map(card).join(""));
  state.shown += next.length;
}

function showEmpty(html) { $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${html}</div>`; }

async function init() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    $("status").textContent = "未設定";
    showEmpty("請打開 <code>index.html</code>，在最下方 script 開頭填入<br><code>SUPABASE_URL</code> 與 <code>SUPABASE_ANON_KEY</code>。");
    return;
  }
  try {
    const [kits, runs] = await Promise.all([
      api("kits?select=*&source=neq.hobbywatch&order=first_seen.desc"),
      api("scrape_runs?select=*&order=started_at.desc&limit=1"),
    ]);
    state.all = kits;
    state.fb = loadLocal();
    try {
      const rows = await api("kit_feedback?select=*");
      state.remote = true;
      const remote = {}; for (const r of rows) remote[r.kit_id] = r;
      // 本機有、雲端沒有的（例如之前離線按的）補上傳
      for (const [id, r] of Object.entries(state.fb)) if (!remote[id]) saveRemote(id, r);
      state.fb = { ...state.fb, ...remote };
      saveLocal();
    } catch { state.remote = false; }
    computeScores(kits);
    renderStatus(runs[0]);
    if (!kits.length) { showEmpty("資料庫還沒有資料。<br>到 GitHub → Actions → 手動執行一次每日更新。"); return; }
    applyFilters();
  } catch (e) {
    $("status").textContent = "⚠ 讀取失敗"; $("status").classList.add("bad");
    showEmpty("讀取 Supabase 失敗：<br>" + esc(e.message));
  }
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  state.tab = b.dataset.tab; applyFilters();
});
let qTimer;
$("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; applyFilters(); }, 200); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; applyFilters(); });
$("minScore").addEventListener("change", (e) => { state.minScore = +e.target.value; applyFilters(); });
$("grid").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  vote(b.closest(".card").dataset.id, +b.dataset.v);
});
$("learn").addEventListener("click", (e) => { if (e.target.id === "reorder") { applyFilters(); scrollTo(0, 0); } });
function applySize(small) {
  document.body.classList.toggle("small", small);
  $("sizeBtn").textContent = small ? "大圖" : "小圖";
  try { localStorage.setItem("kitradar_small", small ? "1" : "0"); } catch {}
}
applySize((() => { try { return localStorage.getItem("kitradar_small") === "1"; } catch { return false; } })());
$("sizeBtn").addEventListener("click", () => applySize(!document.body.classList.contains("small")));
$("hideOut").addEventListener("change", (e) => { state.hideOut = e.target.checked; applyFilters(); });
$("status").addEventListener("click", () => $("statusDetail").classList.toggle("open"));
new IntersectionObserver((es) => { if (es[0].isIntersecting && state.shown < state.view.length) renderMore(); },
  { rootMargin: "800px" }).observe($("sentinel"));

init();

// ---- 自動更新：回到 App 時檢查網頁有沒有新版本，有就自動重新載入 ----
async function pageHash() {
  const r = await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" });
  const t = await r.text();
  let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0;
  return h;
}
let baseHash = null;
pageHash().then((h) => { baseHash = h; }).catch(() => {});
let lastCheck = Date.now();
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  try {
    const h = await pageHash();
    if (baseHash !== null && h !== baseHash) { location.reload(); return; }
  } catch {}
  // 離開超過 30 分鐘 → 重新讀商品資料
  if (Date.now() - lastCheck > 30 * 60 * 1000) { lastCheck = Date.now(); init(); }
});
</script>
</body>
</html>
